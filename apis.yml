aid: coachup
name: Coachup
description: >-
  CoachUp is the nation's leading private sports coaching marketplace, founded in
  2012 in Boston by Jordan Fliegel, Arian Radmand, and Gabe Durazo. It connects
  athletes of all levels — and the parents of young athletes — with vetted,
  background-checked private and small-group coaches across basketball, soccer,
  football, baseball, running and track and field, volleyball, swimming, softball,
  tennis, lacrosse, fitness, and dance. Coaches are discoverable by sport and
  location, sessions average $40–$60 per hour, and every session is backed by
  $1 million liability insurance. The platform has hosted more than 13,000 coaches
  serving over 100,000 athletes, with Boston, New York, Los Angeles, Dallas, and
  Chicago among its top training markets. CoachUp is backed by General Catalyst,
  Point Judith Capital, and Techstars. As of this profile CoachUp exposes only a
  consumer web and mobile experience with no public developer program, API
  documentation, or machine-readable API surface.
